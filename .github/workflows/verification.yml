name: Vérification

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verifier:
    name: Types, build et contrôle du corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Contrôler les planches SVG
        run: node scripts/verify-schemas.mjs

      - name: Construire le site
        run: npm run build

      - name: Contrôler le corpus
        run: npm run verify
